<div class="dw" id="dw" role="region" aria-label="DewTask interactive preview. Change task status, add up to 2 custom tasks, or delete tasks.">
  <nav class="dwn" id="dwNav" aria-label="DewTask views">
    <div class="dwl">
      <svg viewBox="0 0 512 512" aria-hidden="true"><use href="#dewIcon"/></svg>
      <span>Dew<i>Task</i></span>
    </div>
    <button type="button" data-v="overview" class="on" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
      <span>Overview</span>
    </button>
    <button type="button" data-v="all" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.2" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.2" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.2" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
      <span>All Tasks</span>
    </button>
    <button type="button" data-v="today" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v3M16 3v3"/><path d="m8.5 14.5 2 2 4-4.5"/></svg>
      <span>Today</span>
    </button>
    <button type="button" data-v="upcoming" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Upcoming</span>
    </button>
    <div class="dwu"><b>A</b><span>Arnab</span></div>
  </nav>

  <div class="dwm">
    <div class="dwt">
      <input id="dwq" type="text" placeholder="Filter tasks across views..." aria-label="Filter tasks" autocomplete="off">
      <button type="button" class="dwadd" id="dwAddBtn" aria-label="Open new task popup" aria-expanded="false" title="Create new task (Max 2 custom)">
        <span>+</span>
        <small id="dwQuota">0/2</small>
      </button>
    </div>

    <!-- Compact Popup Modal for Naming & Adding a Task -->
    <div class="dw-pop" id="dwPop" hidden role="dialog" aria-modal="false" aria-label="Create new task">
      <form id="dwForm" class="dw-pop-box">
        <div class="dw-pop-head">
          <span>NEW TASK</span>
          <span class="dw-pop-lim" id="dwPopLim">2 slots left</span>
        </div>
        <input id="dwNewTitle" type="text" maxlength="48" placeholder="Enter task name (e.g. Benchmark SQLite WAL)" required autocomplete="off">
        <div class="dw-pop-row">
          <select id="dwNewTag" aria-label="Workspace tag">
            <option value="DewTask">Workspace: DewTask</option>
            <option value="Backend">Workspace: Backend</option>
            <option value="R&D">Workspace: R&amp;D</option>
          </select>
          <div class="dw-pop-actions">
            <button type="button" class="dw-btn-cancel" id="dwCancel">Cancel</button>
            <button type="submit" class="dw-btn-save">Create</button>
          </div>
        </div>
      </form>
    </div>

    <div id="dwBody"><noscript><small class="dw-hint">Enable JavaScript to try the interactive preview.</small></noscript></div>
    <div id="dwToast" class="dw-toast" role="status" aria-live="polite"></div>
  </div>
</div>

      <stop offset="1" stop-color="#080808" stop-opacity=".45"/>
    </linearGradient>
    <clipPath id="portrait">
      <rect x="12" y="210" width="224" height="286.3" rx="10"/>
    </clipPath>
    <filter id="shadow" x="-.1" y="-.1" width="1.2" height="1.2">

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Arnab Saha’s portfolio badge</title>
  <desc id="desc">Two charcoal badges hanging from retractable reels. The front shows Arnab’s illustrated portrait and role. The back has a QR code for arnabsaha7.github.io.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#f3f5f8"/>
      <stop offset="1" stop-color="#dfe5ec"/>
    </linearGradient>
    <linearGradient id="metal" x2="1" y2="0">
      <stop stop-color="#8b8b8b"/>
      <stop offset=".45" stop-color="#ededed"/>
      <stop offset="1" stop-color="#858585"/>
    </linearGradient>
    <linearGradient id="portrait-shade" x2="0" y2="1">
